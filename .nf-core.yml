repository_type: pipeline

nf_core_version: 3.5.1

lint:
  files_unchanged:
    - .prettierignore
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .prettierignore
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pan2met-wf_logo_light.png
    - docs/images/nf-core-pan2met-wf_logo_light.png
    - docs/images/nf-core-pan2met-wf_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - assets/multiqc_config.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pan2met-wf_logo_light.png
    - docs/images/nf-core-pan2met-wf_logo_light.png
    - docs/images/nf-core-pan2met-wf_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: labgem
  name: pan2met-wf
  description: Predict metabolic networks at pangenome scale
  author: Samuel Ortion
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - email
    - adaptivecard
    - slackreport
  is_nfcore: false
